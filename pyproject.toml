[project]
name = "ai_native_cad"
version = "0.5.0"
description = "Agent-first CAD design workbench with controlled execution and traceable deliverables"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4",
]

[project.optional-dependencies]
web = [
    "nicegui>=2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
